<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مساعدك الذكى</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <style>

        * {
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Tahoma', sans-serif;
            background-color:transparent;
            margin: 0;
            overflow-x: hidden;
        }
        .chat-container {
            width: 300px;
            max-height: 700px;
            border: 1px solid #ccc;
            background: #f9f9f9;
            position: fixed;
            bottom: 60px;
            left: 20px;
            border-radius: 10px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #042C76 #f0f0f0;
        }
        .bot-message {
            background-color: #f0f3f5;
            color:black;
            text-align: right;
            padding: 10px;
            font-size: 14px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 10px;
            margin-top: 5px;
            margin-left: 5px;
            margin-bottom: 5px;
            max-width: 70%;
            word-wrap: break-word;
            align-self: flex-end;
            box-shadow:  0 2px 6px rgba(0, 0, 0, 0.3);
        }

        #chatBox::-webkit-scrollbar {
        width: 8px;
        display: none;
        }
        #chatBox::-webkit-scrollbar-track {
        background: transparent;
        }
        #chatBox::-webkit-scrollbar-thumb {
        background-color: #042C76;
        border-radius: 0;
        border: none;
        }
        #chatBox::-webkit-scrollbar-button {
        display: none;
        height: 0;
        background: none;
        }
        .chat-container::-webkit-scrollbar-button {
        display: none;
        height: 0;
        background: none;
        }
        #chatBox {
        height:348px;
        max-height: 400px;
        overflow-y: auto;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        scrollbar-width: thin;
        scrollbar-color: #042C76 transparent;
        }
        .user-message {
            background-color: #042C76; 
            color:white;
            padding: 5px;
            font-size: 14px;
            border-bottom-left-radius: 10px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 0;
            margin-top: 3px;
            margin-right: 5px;
            max-width: 60%;
            word-wrap: break-word;
            align-self: flex-start;
            box-shadow:  0 1px 4px rgba(0, 0, 0, 0.3);
        }
        .yes-no-options {
        display: flex !important;
        flex-direction: column !important;
        align-items: flex-start; 
        width: max-content;
        }

        .yes-no-options button {
        width: 100%;
        padding: 8px 30px;
        border: none;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        margin: 5px; 
        }

        .btn-yes {
        background-color: #042C76;
        margin-bottom: 2px;
        }

        .btn-no {
        background-color: #9eaab1;
        }
        .btn-yes, .btn-no {
            margin: 3px 0;
            color: white;
            border: none;
            padding: 8px 30px 5px 30px;
            border-radius: 6px;
            width: 100%; 
            box-sizing: border-box;
        }
        .optionsForm-button {
        background-color: #042C76;
        color: white;
        border: none;
        border-radius: 6px;
        text-align: center;
        padding-left: 30px;
        padding-right: 30px;
        padding-bottom:5px;
        padding-top:5px;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            background-color: #f0f3f5;
            gap: 5px;
            margin-top: 5px;
            max-width: 260px;
            padding: 10px;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
            border-top-left-radius: 10px;
        }
        #fixedButton {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 10px 10px;
            background-color: #FFB703;
            color: white;
            border: none;
            border-radius: 20px;
            cursor:pointer;
            z-index: 1000;
            box-shadow:  0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .popup-intro {
            position: fixed;
            height:450px;
            bottom: 10px; 
            left: 20px;
            width: 350px;
            background: linear-gradient(to right,#042C76,  #005bbc);
            border: 1px solid #ccc;
            border-radius: 8px;
            z-index: 999;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }
        .intro-content {
        font-size: 14px;
        margin: 10px;
        padding:10px;
        margin-bottom: 10px;
        color:white;
        }
        #startChatBtn {
        background-color: white;
        color: #042C76;
        border: none;
        padding: 10px;
        margin:10px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        box-shadow:  0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .start-chat-btn{
            margin-top: 10px;
            display: flex;
            justify-content: center;
        }
        #popupBox {
            position: fixed;
            height:450px;
            bottom: 10px; 
            left: 20px;
            width: 350px;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 8px;
            z-index: 999;
            overflow: hidden;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }
        #popupHeader {
            display: flex;
            justify-content: flex-end;
            background: linear-gradient(to right,#042C76,  #005bbc);
            padding: 2px;
            border-bottom: 1px solid ;
            border-top-right-radius: 6px;
            border-top-left-radius: 6px;
            justify-content: space-between;
        }
        .intro-header{
            display: flex;
            justify-content: flex-end;
        }
        #closeButton {
        font-size: 25px;
        color:white;
        margin-left: 13px;
        }
        .close-intro{
        font-size: 25px;
        color:white;
        margin-left: 13px;
        }
        .popup-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 5px;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            background-color: #f9f9f9;
            }
        .user-input {
        width: 100%;
        font-size: 13px;
        border-radius: 6px;
        border: none;
        outline: none;
        background-color: #f9f9f9;
        }
        .send-button-left {
            width: 40px;
            height: 40px;
            border: none;
            background-color:  #f9f9f9;
            color: #042C76;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            transform: scaleX(-1); 
            }

        .chatbot-logo {
            width:35px;
            border-radius: 50%;
            object-fit: cover;
            margin:5px;
            box-shadow:  0 2px 6px rgba(0, 0, 0, 0.3);

            }
        .bot-message-wrapper ,.message-wrapper {
                display: flex;
                align-items: center;
                justify-content: flex-end; 
                margin-top: 5px;
            }
        .chatbot-name {
            display: flex;
            align-items: center;
            gap: 10px;
            }

        .chat-title {
            font-size: 14px;
            color: white;
            }
        .confirm-popup {
            position: fixed;
            bottom: 100px;
            left: 190px;
            transform: translate(-50%, -50%);
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 5px;
            padding: 20px;
            z-index: 9999;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            }
            .confirm-popup-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            }
        .confirm-popup .btn-yes {
            background-color: #042C76;
            color: white;
            }
        .confirm-popup .btn-no {
            background-color: #9eaab1;
            color: white;
            }
        .confirm-popup button {
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            }
        .popup-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 99;
            }
    </style>
</head>
<body>
    <button id="fixedButton">مساعدك الذكى</button>
<div id="introPopup" style="display:none;" class="popup-intro">
  <div class="intro-header">
    <span class="close-intro" style="cursor: pointer;" id="closeIntroPopup">X</span>
  </div>
  <div class="intro-content">
    <h2>مرحباً بك!</h2>
    <h4>انا مساعدك الذكى، </h4>
    <h4>كيف يمكننى مساعدتك؟</h4>
    <div class="start-chat-btn">
        <button id="startChatBtn">ابدأ المحادثة</button>
    </div>
  </div>
</div>
    <div class="chat-container" id="popupBox" style="display: none;">
        <div id="popupHeader">
        <div class="chatbot-name">
        <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo" class="chatbot-logo">
        <div class="chat-title">مساعدك الذكي</div>
        </div>
        <span id="closeButton" style="cursor: pointer;">X</span>
        </div>
        <div class="chat-box" id="chatBox">        
            <div id="optionsForm" class="options d-flex flex-column" style="display: none;"></div>
            <div id="yesNoOptions" class="yes-no-options" style="display: none;">
                <button type="button" id="yesButton" class="btn-yes">نعم</button>
                <button type="button" id="noButton" class="btn-no">لا</button>
            </div>
        </div>
        <div class="popup-footer">
            <input type="text" class="user-input" id="userInput" placeholder="اكتب رسالتك هنا...">
            <button class="send-button-left" onclick="sendMessage()" id="sendButton"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
    <script>
        const fixedButton = document.getElementById('fixedButton');
        const popupBox = document.getElementById('popupBox');
        const chatBox = document.getElementById('chatBox');
        const optionsForm = document.getElementById('optionsForm');
        const yesNoOptions = document.getElementById('yesNoOptions');
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const closeButton = document.getElementById('closeButton');
        const minimizeButton = document.getElementById('minimizeButton');
        const introPopup = document.getElementById('introPopup');
        const startChatBtn = document.getElementById('startChatBtn');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button-left');
        const closeIntroPopup= document.getElementById('closeIntroPopup');
        const options = ['تفعيل البريد الجامعى', 'تعريف الكلية', 'تسجيل الدخول','كتابة الاستفسارات','الملف الشخصى'];
        const profileOptions = ['بيانات الطالب','حساب المعدل التراكمى','تسجيل المقررات','المواد الدراسية','مكتبة المواد','الاشعارات','الجداول الدراسية','درجات الطالب'];
        let hasChosenOption = false;


        fixedButton.addEventListener('click', () => {
        fixedButton.style.display = 'none';
        introPopup.style.display = 'block';
        });
       
        startChatBtn.addEventListener('click', () => {
        introPopup.style.display = 'none';
        popupBox.style.display = 'block';
        resetChat(); 
        });
        
function appendUserMessage(text) {
    const message = document.createElement('div');
    message.className = 'message user-message';
    message.textContent = text;
    chatBox.appendChild(message);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function appendBotMessage(text) {
    const messageContainer = document.createElement('div');
    messageContainer.className = 'bot-message-wrapper';

    const botImage = document.createElement('img');
    botImage.src = 'static/images/logo.jpg'; 
    botImage.className = 'chatbot-logo';

    const message = document.createElement('div');
    message.className = 'message bot-message';
    message.textContent = text;

    messageContainer.appendChild(message);
    messageContainer.appendChild(botImage);
    chatBox.appendChild(messageContainer);

    chatBox.scrollTop = chatBox.scrollHeight;
}

        function appendUserMessage(text) {
        const message = document.createElement('div');
        message.className = 'message user-message';  
        message.textContent = text;
        chatBox.appendChild(message);
        chatBox.scrollTop = chatBox.scrollHeight;
        }


       function displayOptions() {
    if (hasChosenOption) return;

    const oldOptions = chatBox.querySelector('.options-container');
    if (oldOptions) oldOptions.remove();

    const wrapper = document.createElement('div');
    wrapper.className = 'bot-message-wrapper';

    const botImage = document.createElement('img');
    botImage.src = 'static/images/logo.jpg';
    botImage.className = 'chatbot-logo';

    const container = document.createElement('div');
    container.className = 'message bot-message options-container';

    options.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'optionsForm-button';
        btn.type = 'button';
        btn.textContent = option;
        btn.onclick = () => handleOptionClick(option, container);
        container.appendChild(btn);
    });

    wrapper.appendChild(botImage);
    wrapper.appendChild(container);
    wrapper.appendChild(botImage);
    chatBox.appendChild(wrapper);

    chatBox.scrollTop = chatBox.scrollHeight;
}


function handleOptionClick(option, container) {
    hasChosenOption = true;


    appendUserMessage(option);

    if (option === 'تفعيل البريد الجامعى') {
        appendBotMessage('للحصول على البريد الجامعي، اضغط على زر "الحصول على البريد الجامعي"، ثم أدخل اسمك بالكامل والرقم القومي، وسيتم عرض بريدك الجامعي فورًا.');
    } else if (option === 'تعريف الكلية') {
        appendBotMessage('إذا كنت ترغب في معرفة معلومات عن الكلية، يمكنك الضغط على زر "عن الكلية" في الأعلى، حيث ستجد نبذة عن الكلية بالإضافة إلى تفاصيل الأقسام المتاحة.');
    } else if (option === 'تسجيل الدخول') {
        appendBotMessage('إذا كنت ترغب فى تسجيل الدخول إلى الموقع، اضغط على زر "سجل الآن". سيطلب منك ادخال إسمك، الرقم القومى ، البريد الجامعى.  بعد إتمام التسجيل بنجاح، سيظهر لك نافذة لتأكيد التسجيل ، سيطلب منك إدخال البريد الجامعى مرة اخرى ورقم المرور. ثم سيظهر لك ملفك الشخصى يتضمن جميع بياناتك.');
    }else if (option === 'كتابة الاستفسارات') {
        appendBotMessage('إذا كان لديك أى استفسار، انزل  إلى أسفل الصفحة ، ثم ادخل بريد الجامعى ورقمك القومى، واكتب استفسارك ثم سيتم الرد عليك.');
    } else if (option === 'الملف الشخصى') {
        displayProfileOptions();
        return;
    }
    

    appendBotMessage('هل تريد الاستفسار عن شيء آخر؟');
    showYesNoOptions();
    chatBox.scrollTop = chatBox.scrollHeight;
}

function displayProfileOptions() {
  appendBotMessage('اختر أحد الخيارات التالية للملف الشخصي:');

  const oldOptions = chatBox.querySelector('.options-container');

  const wrapper = document.createElement('div');
  wrapper.className = 'bot-message-wrapper';

  const botImage = document.createElement('img');
  botImage.src = 'static/images/logo.jpg';
  botImage.className = 'chatbot-logo';

  const container = document.createElement('div');
  container.className = 'message bot-message options-container';

  profileOptions.forEach(option => {
    const btn = document.createElement('button');
    btn.className = 'optionsForm-button';
    btn.type = 'button';
    btn.textContent = option;
    btn.onclick = () => handleProfileOptionClick(option);
    container.appendChild(btn);
  });

  wrapper.appendChild(botImage);
  wrapper.appendChild(container);
  wrapper.appendChild(botImage);
  chatBox.appendChild(wrapper);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function handleProfileOptionClick(option) {
  appendUserMessage(option);

  if (option === 'بيانات الطالب') {
    appendBotMessage('.فى الملف الشخصى، عند الضغط على "بيانات الطالب" ستتمكن من مشاهدة كل بياناتك، بما فى ذلك الإسم و البريد الجامعى و الفرقة والقسم وإلخ.');
  } else if (option === 'حساب المعدل التراكمى') {
    appendBotMessage('في الملف الشخصي، عند الضغط على "المعدل التراكمي"، يمكنك حساب المعدل التراكمي للفصل الدراسي. فقط اكتب اسم المادة، الدرجة، وعدد الساعات الخاصة بها. يمكنك إضافة مواد أخرى حتى تنتهي من إدخال جميع مواد الفصل. بعد ذلك، اضغط زر "حساب المعدل التراكمي للفصل" ليظهر لك النتيجة.');
  } else if (option === 'تسجيل المقررات') {
    appendBotMessage(' في الملف الشخصى ، عند الضغط على" تسجيل المقررات"، ستجد جميع المقررات الخاصة بكل السنوات الدراسية، ويمكنك اختيار المقررات التي تريد التسجيل بها في كل فصل دراسي ،ثم بعد التسجيل تضغط على تأكيدلكى يتم التسجيل بنجاح ويمكنك أيضا طباعة الأستمارة.');
  } else if (option === 'المواد الدراسية') {
    appendBotMessage('في الملف الشخصي، عند الضغط على "المواد الدراسية"، ستظهر لك جميع المقررات التي سجلت بها خلال الأربع سنوات الدراسية.');
  }  else if (option === 'مكتبة المواد') {
    appendBotMessage('في الملف الشخصي، عند الضغط على "مكتبة المواد"، ستظهر لك جميع الملفات الخاصة بمقررات الأربع سنوات الدراسية، ويمكنك أيضًا إضافة ملفات جديدة من جهازك.')
  }  else if (option === 'الاشعارات') {
    appendBotMessage('في الملف الشخصي، عند الضغط على "الإشعارات"، ستظهر لك جميع التحديثات والأخبار الجديدة التي تخصك.');
  } else if (option === 'الجداول الدراسية') {
    appendBotMessage('في الملف الشخصي، عند الضغط على "الجداول الدراسية"، ستظهر لك جداول المحاضرات والسكاشن الخاصة بك.');
  } else if (option === 'درجات الطالب') {
    appendBotMessage('في الملف الشخصي، عند الضغط على قسم "الدرجات"، يمكنك عرض جميع درجاتك الأكاديمية بشكل مفصل.');
  } 
  appendBotMessage('هل تريدالاستفسار عن شيء آخر؟');
  showYesNoOptions();
}


function showYesNoOptions() {
    const wrapper = document.createElement('div');
    wrapper.className = 'bot-message-wrapper';

    const botImage = document.createElement('img');
    botImage.src = 'static/images/logo.jpg';
    botImage.className = 'chatbot-logo';

    const messageContainer = document.createElement('div');
    messageContainer.className = 'message bot-message'; 

    const buttonsContainer = document.createElement('div');
    buttonsContainer.className = 'yes-no-option';

    const yesButton = document.createElement('button');
    yesButton.className = 'btn-yes';
    yesButton.textContent = 'نعم';
    yesButton.onclick = () => {
        wrapper.remove();
        appendUserMessage('نعم');
        appendBotMessage('اختر أحد الخيارات التالية:');
        hasChosenOption = false;
        displayOptions();
    };

    const noButton = document.createElement('button');
    noButton.className = 'btn-no';
    noButton.textContent = 'لا';
    noButton.onclick = () => {
        wrapper.remove();
        appendUserMessage('لا');
        appendBotMessage('شكراً لك! نحن دائماً هنا لمساعدتك.');
    };

    buttonsContainer.appendChild(yesButton);
    buttonsContainer.appendChild(noButton);
    messageContainer.appendChild(buttonsContainer);
    wrapper.appendChild(botImage);
    wrapper.appendChild(messageContainer);
    wrapper.appendChild(botImage);
    chatBox.appendChild(wrapper);
    chatBox.scrollTop = chatBox.scrollHeight;
}

        function resetChat() {
            chatBox.innerHTML = '';
            optionsForm.innerHTML = '';
            yesNoOptions.style.display = 'none';
            hasChosenOption = false; 

            appendBotMessage('مرحباً! كيف يمكنني مساعدتك اليوم؟');
            displayOptions();
        }
closeButton.addEventListener('click', () => {
  const overlay = document.createElement('div');
  overlay.className = 'popup-overlay';

  const confirmPopup = document.createElement('div');
  confirmPopup.className = 'confirm-popup';

  const message = document.createElement('p');
  message.textContent = 'هل تريد اغلاق الشات؟';
  confirmPopup.appendChild(message);

  const buttonsWrapper = document.createElement('div');
  buttonsWrapper.className = 'confirm-popup-buttons';

  const yesBtn = document.createElement('button');
  yesBtn.textContent = 'نعم';
  yesBtn.className = 'btn-yes';

  const noBtn = document.createElement('button');
  noBtn.textContent = 'لا';
  noBtn.className = 'btn-no';

  buttonsWrapper.appendChild(yesBtn);
  buttonsWrapper.appendChild(noBtn);
  confirmPopup.appendChild(buttonsWrapper);

  popupBox.appendChild(overlay);
  popupBox.appendChild(confirmPopup);

  yesBtn.addEventListener('click', () => {
  overlay.remove();
  confirmPopup.remove();
  popupBox.style.display = 'none';
  fixedButton.style.display = 'block'; // أضيفي السطر ده هنا كمان
});

  noBtn.addEventListener('click', () => {
    overlay.remove();
    confirmPopup.remove();
  });
});

closeIntroPopup.addEventListener('click', () => {
  introPopup.style.display = 'none';
  fixedButton.style.display = 'block';
});


   function sendMessage() {
    const userInput = document.getElementById("userInput");
    const message = userInput.value.trim();
    if (message === "") return;

    const chatBox = document.getElementById("chatBox");

    const userMessage = document.createElement("div");
    userMessage.className = "user-message";
    userMessage.textContent = message;
    chatBox.appendChild(userMessage);

    userInput.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    fetch("/get", {
        method: "POST",
        body: JSON.stringify({ message: message }),
        headers: {
            "Content-Type": "application/json"
        }
    })
    .then(response => response.json())
    .then(data => {
        const wrapper = document.createElement("div");
        wrapper.className = "bot-message-wrapper";

        const botImage = document.createElement("img");
        botImage.src = "static/images/logo.jpg";
        botImage.className = "chatbot-logo";

        const messageContainer = document.createElement("div");
        messageContainer.className = "message bot-message";
        messageContainer.textContent = data.response;

        wrapper.appendChild(messageContainer);
                wrapper.appendChild(botImage);

        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
    });
}
document.getElementById("userInput").addEventListener("keypress", function (e) {
    if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
    }
});
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
